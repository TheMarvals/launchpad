<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131314" />
    <title>Sin conexión · LAUNCHPAD</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #131314;
        color: #e5e2e3;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(168, 85, 247, 0.16), transparent 42%),
          #131314;
      }

      main {
        width: min(100%, 480px);
        padding: 32px;
        border: 1px solid #424656;
        border-radius: 12px;
        background: rgba(28, 27, 28, 0.92);
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border: 1px solid #424656;
        border-radius: 12px;
      }

      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; color: #8c90a2; line-height: 1.6; }

      button {
        border: 0;
        border-radius: 6px;
        padding: 12px 20px;
        background: #a855f7;
        color: #f3f3ff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon-192x192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>LAUNCHPAD necesita conexión para acceder de forma segura a tus datos. Comprueba tu red e inténtalo nuevamente.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
